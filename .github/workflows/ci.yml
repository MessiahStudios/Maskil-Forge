name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MaskilForge.sln
      - name: Build
        run: dotnet build MaskilForge.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MaskilForge.sln --configuration Release --no-build

  web:
    name: Web tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MaskilForge.Web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MaskilForge.Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
